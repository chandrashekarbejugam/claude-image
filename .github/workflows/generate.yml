name: generate-images

on:
  push:
    paths:
      - "prompts/**.json"
  workflow_dispatch:
    inputs:
      file:
        description: "Prompts file, e.g. prompts/batch1.json"
        required: true

permissions:
  contents: write

concurrency:
  group: generate-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find prompt files
        id: files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=${{ github.event.inputs.file }}" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(ls prompts/*.json | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate images
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          for f in ${{ steps.files.outputs.list }}; do
            echo "== $f"
            python3 generate.py "$f"
          done

      - name: Commit images
        run: |
          git config user.name "imagen-bot"
          git config user.email "imagen-bot@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Add generated images"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
